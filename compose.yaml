services:
  board:
    build: .
    container_name: multi-harness-board
    ports:
      - "${BOARD_PORT}:${BOARD_PORT}"
    volumes:
      - ./.devtool:/app/.devtool:ro
      - ./dist:/app/dist
      - ./server.mjs:/app/server.mjs
      - ./scripts:/app/scripts
    environment:
      - PORT=${BOARD_PORT}
      - BOARD_PORT=${BOARD_PORT}
      - NODE_ENV=development
    restart: unless-stopped
