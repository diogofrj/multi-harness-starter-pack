services:
  board:
    build: .
    container_name: multi-harness-board
    ports:
      - "${BOARD_PORT:-3000}:${BOARD_PORT:-3000}"
    volumes:
      - ./.devtool:/app/.devtool:ro
      - ./dist:/app/dist
      - ./server.mjs:/app/server.mjs
      - ./scripts:/app/scripts
    environment:
      - PORT=${BOARD_PORT:-3000}
      - BOARD_PORT=${BOARD_PORT:-3000}
      - NODE_ENV=development
    restart: unless-stopped
